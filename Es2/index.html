<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RipassoJs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</head>

<body style="background-color: rgb(142, 169, 169);">
    <div class="container col-12 bg-light  mt-5 rounded border border-light shadow p-4">
        <label for="firstN" class="form-label mt-4">Inserisci qui il primo numero</label>
        <input type="number" class="form-control" id="firstN" required placeholder="primo numero">

        <label for="secondN" class="form-label  mt-4">Inserisci qui il secondo numero</label>
        <input type="number" class="form-control" id="secondN" required placeholder="secondo numero">

        <button id="sommaN" class="btn btn-dark mt-4">SOMMA</button>

        <p class="mt-4 pb-4">Risultato: <span id="risultatoN"></span></p>

    </div>
    <script src="main.js"></script>
</body>

</html>
